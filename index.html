<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0718">
<title>政大靈魂塔羅</title>
<meta name="description" content="12 題心理測驗＋塔羅抽牌，找出最適合你的政大建築物或周邊餐廳。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b0718;
    --night-2: #1a1036;
    --violet: #2a1d52;
    --gold: #d9b765;
    --gold-soft: rgba(217, 183, 101, .35);
    --gold-faint: rgba(217, 183, 101, .12);
    --ink: #ece4ff;
    --muted: #a99fc6;
    --parchment: #f2e6c6;
    --parchment-2: #dcc58e;
    --card-ink: #2b1d45;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
    --display: "Cinzel", "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--night); overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.75;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #2b1958 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 100% 100%, #1d1240 0%, transparent 70%),
      var(--night);
    background-attachment: fixed;
    overflow-x: hidden;
    padding: max(24px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
  }
  button { font-family: inherit; touch-action: manipulation; }

  /* ---------- 星空 ---------- */
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay);
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }

  .app { position: relative; z-index: 1; width: 100%; max-width: 980px; margin: 0 auto; }
  .stage { animation: appear .6s ease both; max-width: 640px; margin: 0 auto; }
  .stage.wide { max-width: 960px; }
  @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }

  /* ---------- 共用：面板與按鈕 ---------- */
  .panel {
    position: relative;
    background: linear-gradient(180deg, rgba(42, 29, 82, .72), rgba(18, 11, 43, .82));
    border: 1px solid var(--gold-soft);
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 0 0 4px rgba(11, 7, 24, .5), inset 0 0 0 5px var(--gold-faint);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .panel::before, .panel::after {
    content: "✦"; position: absolute; color: var(--gold); font-size: 14px; line-height: 1;
  }
  .panel::before { top: 10px; left: 12px; }
  .panel::after { bottom: 10px; right: 12px; }

  .ornament { text-align: center; color: var(--gold); letter-spacing: .6em; font-size: 14px; margin: 0 0 6px; padding-left: .6em; }
  .eyebrow { font-family: var(--display); letter-spacing: .3em; color: var(--gold); font-size: 13px; text-align: center; margin: 0; padding-left: .3em; }
  h1 {
    font-size: clamp(30px, 7.5vw, 46px);
    font-weight: 900;
    text-align: center;
    margin: 4px 0 8px;
    line-height: 1.25;
    background: linear-gradient(180deg, #fff3cf, var(--gold) 70%, #a8853a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(217, 183, 101, .25);
  }
  .lead { text-align: center; color: var(--muted); margin: 0 0 26px; font-size: 15px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 12px 26px;
    border-radius: 999px; border: 1px solid var(--gold);
    background: linear-gradient(180deg, #e8cb82, #b8913f);
    color: #1d1233; font-size: 17px; font-weight: 700; letter-spacing: .1em;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(217, 183, 101, .25);
    transition: transform .15s, box-shadow .25s, opacity .25s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--gold); box-shadow: none; }
  .btn.block { width: 100%; }
  @media (hover: hover) {
    .btn:not(:disabled):hover { box-shadow: 0 0 36px rgba(217, 183, 101, .5); }
    .btn.ghost:hover { background: var(--gold-faint); }
  }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin: 18px 0 0; }

  /* ---------- 塔羅牌（共用） ---------- */
  .tarot {
    --w: 120px;
    width: var(--w);
    height: calc(var(--w) * 12 / 7);
    border-radius: calc(var(--w) * .07);
    position: relative;
    user-select: none; -webkit-user-select: none;
  }
  .card-back, .card-front {
    position: absolute; inset: 0;
    border-radius: inherit;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    overflow: hidden;
  }
  .card-back {
    background:
      radial-gradient(circle at 50% 50%, rgba(217, 183, 101, .22) 0 16%, transparent 16.5%),
      radial-gradient(circle at 50% 50%, transparent 0 24%, rgba(217, 183, 101, .35) 24.5% 25.5%, transparent 26%),
      repeating-linear-gradient(45deg, rgba(217, 183, 101, .10) 0 1.5px, transparent 1.5px 11px),
      repeating-linear-gradient(-45deg, rgba(217, 183, 101, .10) 0 1.5px, transparent 1.5px 11px),
      linear-gradient(160deg, #33236a, #140c30);
    border: 1.5px solid var(--gold);
    box-shadow: inset 0 0 0 calc(var(--w) * .04) #150d31, inset 0 0 0 calc(var(--w) * .04 + 1px) var(--gold-soft), 0 10px 28px rgba(0, 0, 0, .55);
    display: grid; place-items: center;
  }
  .card-back::after {
    content: "☾✦☽";
    color: var(--gold);
    font-size: calc(var(--w) * .16);
    letter-spacing: .05em;
    text-shadow: 0 0 12px rgba(217, 183, 101, .6);
  }
  .card-back .sym { position: relative; z-index: 1; font-size: calc(var(--w) * .3); filter: drop-shadow(0 0 10px rgba(217, 183, 101, .5)); }
  .card-back:has(.sym)::after { content: none; }

  .card-front {
    transform: rotateY(180deg);
    background:
      radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .55), transparent 55%),
      linear-gradient(170deg, var(--parchment), var(--parchment-2));
    color: var(--card-ink);
    border: 1.5px solid #9c7a33;
    box-shadow: inset 0 0 0 calc(var(--w) * .035) var(--parchment), inset 0 0 0 calc(var(--w) * .035 + 1.5px) #9c7a33, 0 14px 40px rgba(0, 0, 0, .55);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(var(--w) * .09) calc(var(--w) * .08) calc(var(--w) * .08);
    text-align: center;
  }
  .cf-num { font-family: var(--display); font-weight: 700; font-size: calc(var(--w) * .085); letter-spacing: .15em; line-height: 1; }
  .cf-art {
    width: calc(var(--w) * .66); height: calc(var(--w) * .66);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: calc(var(--w) * .3);
    background:
      radial-gradient(circle, #fff7e0 0 45%, transparent 46%),
      repeating-conic-gradient(from 0deg, rgba(156, 122, 51, .55) 0 4deg, transparent 4deg 15deg);
    border: 1.5px solid #9c7a33;
    box-shadow: 0 0 0 calc(var(--w) * .025) var(--parchment), 0 0 0 calc(var(--w) * .025 + 1px) rgba(156, 122, 51, .6);
  }
  .cf-title { font-family: var(--display); font-weight: 700; font-size: calc(var(--w) * .066); letter-spacing: .08em; line-height: 1.3; }
  .cf-zh { font-size: calc(var(--w) * .065); color: #6a5328; line-height: 1.4; margin-top: 2px; }
  .cf-type { font-weight: 900; font-size: calc(var(--w) * .095); line-height: 1.3; margin-top: calc(var(--w) * .02); }

  /* ---------- 首頁：選模式 ---------- */
  .mode-label { text-align: center; color: var(--gold); letter-spacing: .2em; font-size: 14px; margin: 0 0 14px; padding-left: .2em; }
  .modes { display: flex; justify-content: center; gap: clamp(16px, 6vw, 40px); margin-bottom: 28px; }
  .mode {
    background: none; border: none; padding: 0; cursor: pointer; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .mode .tarot { --w: clamp(104px, 30vw, 140px); transition: transform .35s cubic-bezier(.2, .8, .2, 1), filter .35s; }
  .mode .tarot .card-back { transition: box-shadow .35s; }
  .mode .m-name { font-weight: 700; font-size: 16px; letter-spacing: .1em; }
  .mode .m-sub { font-size: 12px; color: var(--muted); margin-top: -8px; }
  .mode.selected .tarot { transform: translateY(-10px) rotate(-2deg); }
  .mode.selected .card-back { box-shadow: 0 0 0 2px var(--gold), 0 0 36px rgba(217, 183, 101, .6), inset 0 0 0 calc(var(--w) * .04) #150d31; }
  .mode.selected .m-name { color: var(--gold); }
  .modes.has-choice .mode:not(.selected) .tarot { filter: brightness(.55) saturate(.6); }
  @media (hover: hover) { .mode:hover .tarot { transform: translateY(-6px); } }

  /* ---------- 測驗 ---------- */
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .back { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 8px 4px; min-height: 44px; }
  .back:disabled { visibility: hidden; }
  .counter { font-family: var(--display); color: var(--gold); letter-spacing: .15em; font-size: 15px; }
  .stars { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
  .stars span { width: 10px; height: 10px; transform: rotate(45deg); border: 1px solid var(--gold-soft); transition: background .3s, box-shadow .3s; }
  .stars span.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .stars span.now { border-color: var(--gold); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 10px var(--gold); } }
  .q-label { text-align: center; font-family: var(--display); color: var(--gold); letter-spacing: .3em; font-size: 13px; margin: 0; padding-left: .3em; }
  .q-title { text-align: center; font-size: clamp(20px, 5vw, 25px); line-height: 1.5; margin: 4px 0 24px; font-weight: 700; }
  .options { display: grid; gap: 12px; }
  .option {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 56px; padding: 12px 18px;
    text-align: left; font-size: 16px; line-height: 1.5;
    color: var(--ink);
    background: rgba(11, 7, 24, .45);
    border: 1px solid var(--gold-soft);
    border-radius: 12px;
    cursor: pointer;
    transition: background .2s, border-color .2s, transform .15s, box-shadow .2s;
  }
  .option .key {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 14px;
    color: var(--gold); border: 1px solid var(--gold-soft);
  }
  .option:active { transform: scale(.98); }
  .option.chosen { background: rgba(217, 183, 101, .18); border-color: var(--gold); box-shadow: 0 0 20px rgba(217, 183, 101, .3); }
  .option.chosen .key { background: var(--gold); color: #1d1233; }
  @media (hover: hover) { .option:hover { background: rgba(217, 183, 101, .1); border-color: var(--gold); } }
  .q-anim { animation: qIn .45s ease both; }
  @keyframes qIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

  /* ---------- 占卜中 ---------- */
  .oracle { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 18px; }
  .wheel {
    width: 140px; height: 140px; margin: 0 auto; border-radius: 50%;
    border: 1px solid var(--gold);
    background: repeating-conic-gradient(rgba(217, 183, 101, .5) 0 2deg, transparent 2deg 30deg);
    box-shadow: 0 0 40px rgba(217, 183, 101, .35), inset 0 0 30px rgba(217, 183, 101, .3);
    display: grid; place-items: center;
    animation: spin 3s linear infinite;
  }
  .wheel::after { content: "✦"; color: var(--gold); font-size: 36px; animation: spin 3s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .oracle-text { font-size: 18px; letter-spacing: .2em; color: var(--gold); margin: 0; padding-left: .2em; }
  .oracle-sub { color: var(--muted); margin: 0; font-size: 14px; }

  /* ---------- 抽牌 ---------- */
  #draw { min-height: 80vh; min-height: 80dvh; display: flex; flex-direction: column; justify-content: center; }
  .fan { width: 100%; }
  .draw-head { text-align: center; margin-bottom: 8px; }
  .draw-head h2 { font-size: clamp(22px, 5.5vw, 30px); margin: 4px 0; }
  .draw-head p { color: var(--muted); margin: 0; font-size: 15px; }
  .fan {
    --fw: clamp(66px, 17vw, 120px);
    position: relative;
    height: calc(var(--fw) * 12 / 7 + 90px);
    margin: 10px auto 0;
  }
  .fan-card {
    position: absolute; left: 50%; bottom: 30px;
    margin-left: calc(var(--fw) / -2);
    transform-origin: 50% 100%;
    transition: transform .7s cubic-bezier(.2, .8, .2, 1), opacity .5s;
    cursor: pointer;
    background: none; border: none; padding: 0;
  }
  .fan-card .tarot { --w: var(--fw); transition: transform .3s, filter .3s; }
  .fan-card .card-back { transition: box-shadow .3s; }
  .fan-card:focus-visible { outline: none; }
  .fan-card:focus-visible .card-back { box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(217, 183, 101, .6); }
  @media (hover: hover) {
    .fan:not(.done) .fan-card:hover .tarot { transform: translateY(-22px); }
    .fan:not(.done) .fan-card:hover .card-back { box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(217, 183, 101, .55); }
  }
  .fan-card.picked .tarot { transform: translateY(-40px) scale(1.12); }
  .fan-card.picked .card-back { box-shadow: 0 0 0 2px var(--gold), 0 0 50px rgba(217, 183, 101, .8); }
  .fan-card.away { opacity: 0; }
  .draw-hint { text-align: center; color: var(--gold); font-size: 14px; letter-spacing: .15em; margin: 0; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* ---------- 揭牌結果 ---------- */
  .reveal { display: grid; gap: 28px; align-items: start; }
  .reveal-card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .flip { perspective: 1400px; }
  .flip .tarot { --w: min(280px, 68vw); }
  .flip-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.3, .7, .2, 1);
    border-radius: inherit;
  }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .flip.glow .card-front { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: inset 0 0 0 calc(var(--w) * .035) var(--parchment), inset 0 0 0 calc(var(--w) * .035 + 1.5px) #9c7a33, 0 0 30px rgba(217, 183, 101, .35); }
    50%      { box-shadow: inset 0 0 0 calc(var(--w) * .035) var(--parchment), inset 0 0 0 calc(var(--w) * .035 + 1.5px) #9c7a33, 0 0 60px rgba(217, 183, 101, .7); }
  }
  .kw { color: var(--gold); font-size: 14px; letter-spacing: .1em; text-align: center; margin: 0; }

  .reading { opacity: 0; transform: translateY(18px); transition: opacity .8s ease, transform .8s ease; }
  .reading.show { opacity: 1; transform: none; }
  .reading h2 { font-size: clamp(24px, 6vw, 32px); margin: 0 0 6px; text-align: center; }
  .reading h2 small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; letter-spacing: .2em; }
  .r-desc { color: var(--ink); opacity: .9; margin: 0 0 22px; text-align: center; }
  .omen {
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 20px 20px 18px;
    background: linear-gradient(180deg, rgba(217, 183, 101, .14), rgba(217, 183, 101, .04));
    margin-bottom: 18px;
  }
  .omen-label { font-size: 13px; color: var(--gold); letter-spacing: .2em; margin: 0; }
  .omen-name { font-size: clamp(22px, 5.5vw, 27px); margin: 2px 0; line-height: 1.4; }
  .omen-area { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .omen-why { margin: 0 0 10px; }
  .omen-tip { font-size: 14px; margin: 0 0 14px; opacity: .9; }
  .map-link {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
    color: var(--gold); font-weight: 700; text-decoration: none; border-bottom: 1px dashed var(--gold-soft);
  }
  .secret { border: 1px dashed var(--gold-soft); border-radius: 14px; padding: 14px 18px; margin-bottom: 22px; font-size: 15px; }
  .secret b { color: var(--gold); }
  .secret .s-label { display: block; font-size: 12px; color: var(--muted); letter-spacing: .2em; margin-bottom: 2px; }
  .reading > h3 { font-size: 15px; color: var(--gold); letter-spacing: .2em; margin: 0 0 12px; font-weight: 600; }
  .bars { display: grid; gap: 9px; margin-bottom: 26px; }
  .bar-row { display: grid; grid-template-columns: 112px 1fr 40px; gap: 10px; align-items: center; font-size: 14px; }
  .bar { height: 8px; border-radius: 999px; background: rgba(217, 183, 101, .12); overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #8b6cd8, #b9a3f0); transition: width 1s ease; }
  .bar-row.top .bar > div { background: linear-gradient(90deg, #b8913f, #f0d68e); box-shadow: 0 0 10px rgba(217, 183, 101, .6); }
  .bar-row .pct { text-align: right; color: var(--muted); font-family: var(--display); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions .wide-btn { grid-column: 1 / -1; }

  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--gold); color: #1d1233; z-index: 10;
    padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ---------- 響應式 ---------- */
  @media (max-width: 420px) {
    .panel { padding: 26px 16px; }
    .option { padding: 12px 14px; font-size: 15.5px; }
    .actions { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 100px 1fr 36px; font-size: 13px; }
  }
  @media (min-width: 900px) {
    .reveal { grid-template-columns: 330px 1fr; gap: 40px; }
    .reveal-card { position: sticky; top: 32px; }
    .flip .tarot { --w: 300px; }
    .reading h2, .r-desc { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<main class="app" id="app">

  <!-- 首頁 -->
  <section id="home" class="stage">
    <div class="panel">
      <p class="ornament">✦ ☾ ✦</p>
      <p class="eyebrow">NCCU SOUL TAROT</p>
      <h1>政大靈魂塔羅</h1>
      <p class="lead">回答 12 個問題，再憑直覺抽一張牌，<br>看看命運指引你前往政大的哪個角落。</p>

      <p class="mode-label">— 選擇你的占卜之牌 —</p>
      <div class="modes" id="modes">
        <button class="mode" data-mode="building" type="button" aria-pressed="false">
          <div class="tarot"><div class="card-back"><span class="sym">🏛️</span></div></div>
          <span class="m-name">建築之牌</span>
          <span class="m-sub">推薦校園建築／景點</span>
        </button>
        <button class="mode" data-mode="food" type="button" aria-pressed="false">
          <div class="tarot"><div class="card-back"><span class="sym">🍜</span></div></div>
          <span class="m-name">美食之牌</span>
          <span class="m-sub">推薦政大周邊餐廳</span>
        </button>
      </div>

      <button id="startBtn" class="btn block" type="button" disabled>開始占卜</button>
      <p class="note">占卜結果僅供娛樂；店家營業資訊可能變動，出發前請再確認。</p>
    </div>
  </section>

  <!-- 測驗 -->
  <section id="quiz" class="stage hidden">
    <div class="panel">
      <div class="quiz-top">
        <button id="backBtn" class="back" type="button">← 上一題</button>
        <span id="counter" class="counter">I / XII</span>
      </div>
      <div id="stars" class="stars" aria-hidden="true"></div>
      <div id="qBox">
        <p id="qLabel" class="q-label"></p>
        <h2 id="qTitle" class="q-title"></h2>
        <div id="options" class="options"></div>

const DECKS = {
  building: {
    name: '建築之牌', icon: '🏛️', types: BUILDING_TYPES, questions: BUILDING_QUESTIONS,
    label: '🏛️ 命運指引你前往', shareLabel: '命定之地'
  },
  food: {
    name: '美食之牌', icon: '🍜', types: FOOD_TYPES, questions: FOOD_QUESTIONS,
    label: '🍜 命運為你準備的味道', shareLabel: '命定美食'
  }
};

const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV'];
const FAN_COUNT = 7;

/* ============ 狀態 ============ */
let mode = null;
let current = 0;
let answers = [];
let lastResult = null;
let locked = false;
let picked = false;

const $ = id => document.getElementById(id);
const deck = () => DECKS[mode];
const STAGES = ['home', 'quiz', 'oracle', 'draw', 'reveal'];
function show(id) {
  STAGES.forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo({ top: 0 });
}

/* ============ 星空背景 ============ */
(function makeSky() {
  const sky = $('sky');
  const n = window.innerWidth < 600 ? 60 : 110;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i');
    const size = Math.random() < .85 ? 1 + Math.random() : 2 + Math.random();
    s.className = 'star';
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
      `--d:${2 + Math.random() * 4}s;--delay:${-Math.random() * 6}s`;
    sky.appendChild(s);
  }
})();

/* ============ 首頁：選牌組 ============ */
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode').forEach(b => {
    b.classList.toggle('selected', b.dataset.mode === m);
    b.setAttribute('aria-pressed', b.dataset.mode === m);
  });
  $('modes').classList.add('has-choice');
  $('startBtn').disabled = false;
}
document.querySelectorAll('.mode').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

function startQuiz() {
  current = 0;
  answers = [];
  show('quiz');
  renderQuestion();
}
$('startBtn').addEventListener('click', startQuiz);

/* ============ 測驗 ============ */
function renderQuestion() {
  const qs = deck().questions;
  const item = qs[current];
  $('counter').textContent = `${ROMAN[current]} / ${ROMAN[qs.length - 1]}`;
  $('qLabel').textContent = `${deck().icon} ${deck().name}・QUESTION ${ROMAN[current]}`;
  $('backBtn').disabled = current === 0;
  $('qTitle').textContent = item.q;

  const stars = $('stars');
  stars.innerHTML = '';
  qs.forEach((_, i) => {
    const d = document.createElement('span');
    if (i < current) d.className = 'on';
    else if (i === current) d.className = 'now';
    stars.appendChild(d);
  });

  const box = $('options');
  box.innerHTML = '';
  item.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option' + (answers[current] === i ? ' chosen' : '');
    b.innerHTML = `<span class="key">${'ABCD'[i]}</span><span></span>`;
    b.lastChild.textContent = opt.t;
    b.addEventListener('click', () => choose(i, b));
    box.appendChild(b);
  });

  const q = $('qBox');
  q.classList.remove('q-anim');
  void q.offsetWidth;
  q.classList.add('q-anim');
}

function choose(i, btn) {
  if (locked) return;
  locked = true;
  answers[current] = i;
  btn.classList.add('chosen');
  setTimeout(() => {
    locked = false;
    if (current < deck().questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      show('oracle');
      setTimeout(showDraw, 1800);
    }
  }, 260);
}

$('backBtn').addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(); }
});

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || locked) return;
  let idx = '1234'.indexOf(e.key);
  if (idx < 0) idx = 'abcd'.indexOf(e.key.toLowerCase());
  if (idx >= 0 && $('options').children[idx]) choose(idx, $('options').children[idx]);
});

/* ============ 計分 ============ */
function score() {
  const { types, questions } = deck();
  const total = Object.fromEntries(Object.keys(types).map(k => [k, 0]));
  const primaryCount = Object.fromEntries(Object.keys(types).map(k => [k, 0]));
  answers.forEach((optIdx, qIdx) => {
    const s = questions[qIdx].options[optIdx].s;
    for (const k in s) total[k] += s[k];
    primaryCount[Object.keys(s)[0]]++;
  });
  // 同分時：先比「被選為主要人格的次數」，再比最後一題的主要人格
  const last = answers.length - 1;
  const lastPrimary = Object.keys(questions[last].options[answers[last]].s)[0];
  const ranked = Object.keys(total).sort((a, b) =>
    (total[b] - total[a]) || (primaryCount[b] - primaryCount[a]) ||
    ((b === lastPrimary) - (a === lastPrimary)) || a.localeCompare(b)
  );
  return { total, ranked };
}

/* ============ 抽牌 ============ */
function showDraw() {
  picked = false;
  const fan = $('fan');
  fan.classList.remove('done');
  fan.innerHTML = '';
  for (let i = 0; i < FAN_COUNT; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fan-card';
    b.setAttribute('aria-label', `第 ${i + 1} 張牌`);
    b.innerHTML = '<div class="tarot"><div class="card-back"></div></div>';
    b.addEventListener('click', () => pickCard(b));
    fan.appendChild(b);
  }
  show('draw');
  // 先疊成一疊，再展開成扇形
  requestAnimationFrame(() => requestAnimationFrame(layoutFan));
}

function layoutFan() {
  const fan = $('fan');
  const cards = [...fan.children];
  if (!cards.length) return;
  const fw = cards[0].offsetWidth;
  const avail = fan.offsetWidth;
  const mid = (cards.length - 1) / 2;
  // 依可用寬度調整角度與間距，確保最外側的牌（含旋轉後的牌角）不超出畫面
  const angle = avail < 500 ? 5 : 7;
  const edge = fw / 2 + (fw * 12 / 7) * Math.sin(mid * angle * Math.PI / 180) + 8;
  const step = Math.max(8, Math.min(fw * .62, (avail / 2 - edge) / mid));
  cards.forEach((c, i) => {
    const o = i - mid;
    c.style.transitionDelay = picked ? '0s' : `${i * 70}ms`;
    c.style.transform = `translateX(${o * step}px) translateY(${Math.abs(o) * fw * .07}px) rotate(${o * angle}deg)`;
  });
}
window.addEventListener('resize', () => { if (!$('draw').classList.contains('hidden')) layoutFan(); });

function pickCard(card) {
  if (picked) return;
  picked = true;
  $('fan').classList.add('done');
  [...$('fan').children].forEach(c => {
    c.style.transitionDelay = '0s';
    c.classList.add(c === card ? 'picked' : 'away');
  });
  setTimeout(showReveal, 900);
}

/* ============ 揭牌 ============ */
function showReveal() {
  lastResult = score();
  const t = deck().types[lastResult.ranked[0]];

  $('cfNum').textContent = t.num;
  $('cfArt').textContent = t.emoji;
  $('cfTitle').textContent = t.title;
  $('cfZh').textContent = t.zh;
  $('cfType').textContent = t.name;
  $('kw').textContent = `正位關鍵字｜${t.kw}`;

  renderReading();

  const flip = $('flip');
  flip.classList.remove('flipped', 'glow');
  $('reading').classList.remove('show');
  show('reveal');
  setTimeout(() => flip.classList.add('flipped'), 500);
  setTimeout(() => flip.classList.add('glow'), 1600);
  setTimeout(() => {
    $('reading').classList.add('show');
    animateBars();
  }, 1500);
}

function renderReading() {
  const { total, ranked } = lastResult;
  const { types, label } = deck();
  const t = types[ranked[0]], s = types[ranked[1]];
  const pick = t.place;

  $('rType').textContent = `${t.zh}・${t.name}`;
  $('rDesc').textContent = t.desc;

  $('oLabel').textContent = label;
  $('oName').textContent = pick.name;
  $('oArea').textContent = '📌 ' + pick.area;
  $('oWhy').textContent = pick.why;
  $('oTip').textContent = '💡 ' + pick.tip;
  $('oMap').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(pick.map);

  const sec = $('secret');
  sec.innerHTML = '<span class="s-label">隱藏之牌</span>';
  sec.append(
    Object.assign(document.createElement('b'), { textContent: `${s.num} ${s.title}・${s.name}` }),
    `　你的靈魂深處也藏著這張牌，不妨也去「${s.place.name}」看看。`
  );

  const sum = Object.values(total).reduce((a, b) => a + b, 0);
  const bars = $('bars');
  bars.innerHTML = '';
  ranked.forEach((k, i) => {
    const pct = Math.round((total[k] / sum) * 100);
    const row = document.createElement('div');
    row.className = 'bar-row' + (i === 0 ? ' top' : '');
    row.dataset.pct = pct;
    row.innerHTML = `<span></span><div class="bar"><div></div></div><span class="pct">${pct}%</span>`;
    row.firstChild.textContent = `${types[k].emoji} ${types[k].name}`;
    bars.appendChild(row);
  });

  const other = mode === 'building' ? 'food' : 'building';
  $('switchBtn').textContent = `再抽${DECKS[other].name} ${DECKS[other].icon}`;
}

function animateBars() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#bars .bar-row').forEach(r => {
      r.querySelector('.bar > div').style.width = r.dataset.pct + '%';
    });
  }));
}

// 兩種牌組題目不同，切換時直接開始另一副牌的測驗
$('switchBtn').addEventListener('click', () => {
  setMode(mode === 'building' ? 'food' : 'building');
  startQuiz();
});

$('retryBtn').addEventListener('click', () => show('home'));

$('shareBtn').addEventListener('click', async () => {
  const t = deck().types[lastResult.ranked[0]];
  const text = `🔮 我在「政大靈魂塔羅」抽到了${deck().name}：${t.num} ${t.title}（${t.zh}）・${t.name}！\n` +
               `${deck().shareLabel}：${t.place.name}\n` +
               `來抽抽看你的政大命運之牌 👉 ${location.href}`;
  try {
    await navigator.clipboard.writeText(text);
    toast('已複製結果，貼給朋友吧！');
  } catch {
    toast('複製失敗，請直接截圖分享 🙏');
  }
});

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
